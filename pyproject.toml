[project]
name = "shelter-powerbi"
version = "0.1.0"
description = "Star schema export and a Power BI semantic model (TMDL) over public shelter data."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
